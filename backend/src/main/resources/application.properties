spring.application.name=campus-mart-backend
server.port=${PORT:8080}

# MongoDB Atlas Connection
# Can be provided via MONGODB_URI environment variable
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/campus_mart?serverSelectionTimeoutMS=2000}

# Cloudinary Configuration
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# JWT Authentication
jwt.secret=${JWT_SECRET:campusMartSuperSecureSecretKeyForSigningJwtTokensMinimum256BitsLengthRequired}
jwt.expiration-ms=${JWT_EXPIRATION_MS:604800000}

# Multipart / File Upload Size Limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB

# Logging
logging.level.com.campusmart.backend=INFO
logging.level.org.springframework.data.mongodb=INFO
